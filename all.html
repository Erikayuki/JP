<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Dictionary</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="dictionary-page">

<header class="dictionary-header">
    <h1>📖 Japanese Dictionary</h1>
    <a href="index.html">← กลับไปทบทวน</a>

    <div class="dictionary-toolbar">
        <input
            id="search"
            type="search"
            placeholder="ค้นหา Front / Back"
            autocomplete="off"
            oninput="searchCard()"
        >

        <select id="level" onchange="searchCard()" aria-label="กรองตาม JLPT level">
            <option value="">ทุกระดับ</option>
            <option value="N5">N5</option>
            <option value="N4">N4</option>
            <option value="N3">N3</option>
            <option value="N2">N2</option>
            <option value="N1">N1</option>
        </select>

        <select id="category" onchange="searchCard()" aria-label="กรองตาม Category">
            <option value="">ทุก Category</option>
        </select>
    </div>
</header>

<div class="dictionary">
    <div id="list" class="list-panel" aria-live="polite"></div>

    <div id="detail" class="detail-panel">
        <div class="detail-empty">เลือกคำศัพท์จากด้านซ้าย</div>
    </div>
</div>

<script src="all.js"></script>
</body>
</html>
